apiVersion: apps/v1
kind: Deployment

metadata: 
  name: db-deployment

spec: 
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels: 
      app: task-db

  template: 
    metadata: 
      labels:
        app: task-db

    spec:
      volumes:
        - name: db-init-volume
          configMap:  
            name: db-init

        - name: db-data
          persistentVolumeClaim:
            claimName: db-pvc

      containers: 
        - name: db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"

          ports:
            - containerPort: 5432

          env: 
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: POSTGRES_USER 

            - name: POSTGRES_PASSWORD 
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB 
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: POSTGRES_DB
         
          volumeMounts:
            - name: db-init-volume
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql 

            - name: db-data
              mountPath: /var/lib/postgresql/data
